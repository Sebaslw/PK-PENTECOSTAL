<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Sebastian Lopez - IPUC Natania 6° Etapa">
<!-- PK-PENTECOSTAL · Hecho por Sebastian Lopez · IPUC Natania 6° Etapa · Zona Especial Misionera – Archipiélago de San Andrés, Providencia y Santa Catalina · «Por toda la tierra salió su voz, y hasta el extremo del mundo sus palabras.» Salmos 19:4 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK-PENTECOSTAL - Capa OBS</title>
<link rel="icon" type="image/png" href="/icono-192.png">
<link rel="stylesheet" href="/fuentes.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { -webkit-font-smoothing: antialiased; font-family: 'Lato', 'Segoe UI', sans-serif; }
  #root { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .hidden { display: none !important; }

  /* ============ RÓTULO (overlay) ============ */
  #ovWrap { position: absolute; left: 110px; bottom: 120px; transform-origin: 0 100%; }
  .rotulo { position: relative; display: inline-flex; }
  .rotulo .card { position: relative; overflow: hidden; display: flex; align-items: stretch; min-width: 420px; max-width: 1300px; }
  .rotulo .accent { width: 12px; flex: none; background: var(--c); }
  .rotulo .txt { position: relative; z-index: 2; padding: 18px 40px 20px 28px; display: flex; flex-direction: column; justify-content: center; }
  .rotulo .nombre { font-size: 54px; font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .rotulo .sub { font-size: 28px; margin-top: 6px; font-weight: 400; letter-spacing: .03em; white-space: nowrap; }
  .rotulo .sub:empty { display: none; }
  .rotulo .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
  .rotulo .tint { position: absolute; inset: 0; z-index: 1; }
  .rotulo .shine { position: absolute; inset: -20% 0; z-index: 3; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.85) 50%, transparent 65%); background-size: 250% 100%; animation: shine var(--vel, 3s) ease-in-out infinite; mix-blend-mode: overlay; }
  @keyframes shine { 0% { background-position: 150% 0; } 60%, 100% { background-position: -100% 0; } }

  /* Plantillas */
  .tpl-IPUC-Blanco .tint { background: rgba(255,255,255,.96); }
  .tpl-IPUC-Blanco .nombre { color: #0d2a5c; }
  .tpl-IPUC-Blanco .sub { color: var(--c); font-weight: 700; text-transform: uppercase; font-size: 24px; }
  .tpl-Azul-Noche .tint { background: linear-gradient(90deg, rgba(8,26,64,.95), rgba(18,52,120,.9)); }
  .tpl-Azul-Noche .nombre { color: #fff; }
  .tpl-Azul-Noche .sub { color: #9fc3ff; }
  .tpl-Oscuro-Minimal .tint { background: rgba(0,0,0,.72); }
  .tpl-Oscuro-Minimal .accent { width: 0; }
  .tpl-Oscuro-Minimal .txt { border-bottom: 6px solid var(--c); }
  .tpl-Oscuro-Minimal .nombre { color: #fff; font-weight: 300; letter-spacing: .02em; }
  .tpl-Oscuro-Minimal .sub { color: var(--c); }
  .tpl-Rojo-Moderno .card { transform: skewX(-10deg); }
  .tpl-Rojo-Moderno .txt { transform: skewX(10deg); }
  .tpl-Rojo-Moderno .tint { background: linear-gradient(90deg, #b3001b, #e3123a); }
  .tpl-Rojo-Moderno .accent { background: #fff; }
  .tpl-Rojo-Moderno .nombre { color: #fff; text-transform: uppercase; }
  .tpl-Rojo-Moderno .sub { color: #ffe1e6; }
  .tpl-Cristal .tint { background: rgba(255,255,255,.14); backdrop-filter: blur(14px); }
  .tpl-Cristal .nombre { color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .tpl-Cristal .sub { color: #fff; opacity: .85; }
  .tpl-Color-Pleno .tint { background: var(--c); }
  .tpl-Color-Pleno .accent { background: rgba(255,255,255,.85); }
  .tpl-Color-Pleno .nombre, .tpl-Color-Pleno .sub { color: #fff; }

  /* Entradas / salidas */
  .rotulo { transition: opacity var(--t, .6s) ease, transform var(--t, .6s) cubic-bezier(.2,.8,.2,1), clip-path var(--t, .6s) cubic-bezier(.6,0,.2,1); }
  .rotulo.ap-progresivo { clip-path: inset(0 100% 0 0); opacity: 0; }
  .rotulo.ap-deslizamiento { transform: translateX(-140%); opacity: 0; }
  .rotulo.ap-instantaneo { opacity: 0; transition: none; }
  .rotulo.on { clip-path: inset(0 0 0 0); transform: none; opacity: 1; }

  /* Plantilla "Imagen completa" (overlay estilo ProyectoRP): imagen 1920×1080 + textos en posiciones fijas */
  .rotulo.completa { position: absolute; inset: 0; display: block; }
  .completa .cbg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: contain; }
  .completa .ctx { position: absolute; white-space: nowrap; line-height: 1.1; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .completa .ctx:empty { display: none; }
  .completa .czona { position: absolute; display: flex; align-items: center; overflow: hidden; white-space: nowrap; z-index: 2; }
  .completa .czona span { display: inline-block; line-height: 1.12; letter-spacing: .01em; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .completa .shine { inset: 0; -webkit-mask-size: 1920px 1080px; mask-size: 1920px 1080px; }
  .stinger { position: absolute; inset: -40px -200px; pointer-events: none; z-index: 5; overflow: hidden; }
  .stinger i { position: absolute; top: 0; bottom: 0; width: 55%; transform: skewX(-20deg) translateX(-160%); }
  .stinger.run i { animation: sting var(--sd, .9s) cubic-bezier(.7,0,.3,1) forwards; }
  .stinger.run i:nth-child(2) { animation-delay: calc(var(--sd, .9s) * .12); }
  @keyframes sting { to { transform: skewX(-20deg) translateX(320%); } }

  /* ============ BANNER ============ */
  #banner { position: absolute; overflow: hidden; transition: opacity var(--t, .6s) ease, transform var(--t, .6s) cubic-bezier(.2,.8,.2,1); }
  #banner.abajo { left: var(--m); right: var(--m); bottom: var(--m); height: var(--alto); }
  #banner.lateral { right: var(--m); top: var(--m); bottom: var(--m); width: 620px; }
  #banner.ap-progresivo { opacity: 0; transform: translateY(20px); }
  #banner.lateral.ap-progresivo { transform: translateX(20px); }
  #banner.ap-deslizamiento { opacity: 1; transform: translateY(calc(100% + var(--m) + 20px)); }
  #banner.lateral.ap-deslizamiento { transform: translateX(calc(100% + var(--m) + 20px)); }
  #banner.ap-instantaneo { opacity: 0; transition: none; }
  #banner.on { opacity: 1; transform: none; }
  .bbg { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; }
  .bbg.difuso { -webkit-mask-image: linear-gradient(to top, #000 55%, transparent); mask-image: linear-gradient(to top, #000 55%, transparent); border-radius: 0; }
  #banner.lateral .bbg.difuso { -webkit-mask-image: linear-gradient(to left, #000 60%, transparent); mask-image: linear-gradient(to left, #000 60%, transparent); }
  .bmedia, .bmedia > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bmedia > * { transform: scale(1.08); }
  .bdim, .bcolor { position: absolute; inset: 0; }
  .bdim { background: #000; }
  #bfx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .btxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px 56px; box-sizing: border-box; }
  .btxt .inner { max-height: 100%; width: 100%; overflow: hidden; transition: opacity .35s; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .btxt .cita { display: block; font-size: .58em; margin-top: .45em; font-weight: 700; font-style: normal; letter-spacing: .04em; }
  /* ============ BANNER LATERAL (diseños de ProyectoRP / PK) ============ */
  #lateral .lzona { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 5; }
  #lateral .lzona .inner { width: 100%; max-height: 100%; overflow: hidden; transition: opacity .3s; }
  #lateral .lzona .cita { display: block; font-size: .6em; margin-top: .5em; font-weight: 700; font-style: normal; letter-spacing: .04em; }

  /* ============ CUENTA REGRESIVA ============ */
  #cuenta { position: absolute; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; z-index: 8;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  #cuenta.oculto { opacity: 0; transform: translate(-50%, -50%) scale(.9); pointer-events: none; }
  #cuenta.caja { padding: .18em .5em .22em; border-radius: .12em; background: linear-gradient(180deg, rgba(10,33,66,.88), rgba(4,22,46,.92)); border: .02em solid rgba(248,184,0,.7); box-shadow: 0 .08em .3em rgba(0,0,0,.45); }
  #cuenta .ct { font-weight: 800; letter-spacing: .18em; font-size: .24em; margin-bottom: .1em; }
  #cuenta .cn { font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 .03em .12em rgba(0,0,0,.5); }
  #cuenta .cn.fin { animation: latir 1.2s ease-in-out infinite; }
  #cuenta .cn.ultimos { color: #ffd666 !important; }
  @keyframes latir { 50% { transform: scale(1.05); } }
  sup { font-size: .55em; vertical-align: .55em; line-height: 0; margin: 0 .12em 0 .25em; opacity: .85; font-weight: 700; }
</style>
</head>
<body>
<div id="root">
  <div id="banner" class="hidden">
    <div class="bbg"><div class="bmedia"></div><div class="bdim"></div><div class="bcolor"></div></div>
    <canvas id="bfx"></canvas>
    <div class="btxt"><div class="inner"></div></div>
  </div>
  <div id="lateral"></div>
  <div id="ovFull"></div>
  <div id="ovWrap"></div>
  <div id="cuenta" class="oculto"><div class="ct"></div><div class="cn"></div></div>
</div>
<script src="/efectos.js"></script>
<script src="/obs/stinger-motor.js"></script>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const ruta = location.pathname.replace('/', '');
  const SOLO = qs.get('solo') || (['overlay', 'banner', 'cuenta'].includes(ruta) ? ruta : '');
  const PREVIEW = qs.get('preview') === '1';
  // Ventana interactiva: rótulo + cuenta regresiva de ejemplo, sin banner
  const EDITOR = PREVIEW && qs.get('editor') === '1';
  const EJEMPLO = { texto: 'Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados.', ref: 'Romanos 8:28 (RV1960)' };
  const root = document.getElementById('root');
  const ovWrap = document.getElementById('ovWrap');
  const banner = document.getElementById('banner');
  const bInner = banner.querySelector('.inner');
  const fx = Efectos.animar(document.getElementById('bfx'), { on: false });
  let st = null, previewItem = undefined, previewBanner = null;
  let ovKey = '', ovEl = null, bTextoKey = '', bMediaKey = '', bVisible = false, apagarT = 0, enPantalla = true, quiereMedios = false;
  // Pausa los videos del banner cuando no se ven (banner oculto, pestaña oculta o vista previa fuera de pantalla)
  function medios(on) {
    if (on !== undefined) quiereMedios = on;
    const play = quiereMedios && enPantalla && !document.hidden;
    banner.querySelectorAll('.bmedia video').forEach((v) => { if (play) { if (v.paused) v.play().catch(() => {}); } else if (!v.paused) v.pause(); });
  }
  document.addEventListener('visibilitychange', () => medios());
  if ('IntersectionObserver' in window) new IntersectionObserver((e) => { enPantalla = e[e.length - 1].isIntersecting; medios(); }).observe(root);

  function escalar() { root.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }
  addEventListener('resize', escalar); escalar();
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (t) => esc(t.trim()).replace(/\[\[([\d-]+)\]\]\s*/g, '<sup>$1</sup>').split('\n').map((l) => l.trim()).join('<br>');
  const urlSegura = (u) => String(u).replace(/'/g, '%27').replace(/"/g, '%22').replace(/</g, '%3C').replace(/>/g, '%3E');
  const hexA = (hex, a) => { const n = parseInt(hex.replace('#', ''), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

  // ---------------- Rótulo ----------------
  function renderOverlay() {
    const o = st.modulo.overlay;
    let item = PREVIEW && previewItem !== undefined ? previewItem : st.overlay.item;
    // Vista previa de un diseño sin nada al aire: se usa el primer nombre de los rótulos como ejemplo
    if (!item && PREVIEW && (o.plantilla === 'Imagen-Completa' || EDITOR)) item = ejemploRotulo();
    const visible = SOLO !== 'banner' && !!item && (PREVIEW ? true : st.overlay.visible);
    ovWrap.style.transform = `translate(${o.x}px, ${o.y}px) scale(${o.escala / 100})`;
    const dis = o.plantilla === 'Imagen-Completa' ? OVL.find((d) => d.id === o.diseno) : null;
    const key = JSON.stringify([item, o.plantilla, o.borde, o.fondo, o.luces, o.aparicion, o.completa, o.diseno, o.extra, dis, PREVIEW ? 0 : st.overlay.id]);
    if (!visible) { ocultarOverlay(); ovKey = ''; return; }
    if (key === ovKey && ovEl) return;
    const nuevo = ovKey === '' || !ovEl || JSON.stringify(item) !== JSON.stringify(ovEl._item);
    ovKey = key;
    ocultarOverlay(nuevo ? 0.25 : 0);
    const el = document.createElement('div');
    el._item = item;
    if (o.plantilla === 'Imagen-Completa') return renderCompleta(o, item, nuevo);
    el.className = `rotulo tpl-${o.plantilla} ap-${o.aparicion}`;
    el.style.setProperty('--c', item.color);
    el.style.setProperty('--t', o.aparicion === 'instantaneo' || !nuevo ? '0s' : '.7s');
    const card = `<div class="card" style="${o.borde.on ? `border:${o.borde.ancho}px solid ${o.borde.color};` : ''}border-radius:${o.borde.radio}px">
        ${o.fondo.url ? `<div class="bgimg" style="background-image:url('${urlSegura(o.fondo.url)}')"></div>` : ''}
        <div class="tint" style="${o.fondo.url ? 'opacity:.82' : ''}"></div>
        <div class="accent"></div>
        <div class="txt"><div class="nombre">${esc(item.texto)}</div><div class="sub">${esc(item.sub || '')}</div></div>
        ${o.luces.on ? `<div class="shine" style="opacity:${o.luces.intensidad / 100};--vel:${Math.max(1, 7 - o.luces.velocidad)}s"></div>` : ''}
      </div>`;
    const sting = o.stinger.on && nuevo ? `<div class="stinger" style="--sd:${o.stinger.duracion}s"><i style="background:${o.stinger.color1}"></i><i style="background:${o.stinger.color2}"></i></div>` : '';
    el.innerHTML = card + sting;
    ovWrap.appendChild(el);
    ovEl = el;
    const delay = sting ? o.stinger.duracion * 450 : 0;
    if (sting) requestAnimationFrame(() => el.querySelector('.stinger').classList.add('run'));
    setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on'))), delay);
  }
  // ---------------- Diseños de overlay (imagen + zonas de texto propias de cada diseño) ----------------
  let OVL = [], ovlRev = -1;
  async function cargarOverlays() {
    try { OVL = await (await fetch('/api/overlays', { cache: 'no-store' })).json(); } catch (_) { OVL = []; }
    ovKey = ''; render();
  }
  function ejemploRotulo() {
    const g = (st.rotulos || []).find((x) => x.items && x.items.length);
    if (!g) return { texto: 'Pastor Juan Pérez', sub: 'Predicador invitado', color: '#00bcd4', grupo: '', itemId: 'ejemplo' };
    const it = g.items[0];
    return { texto: it.texto, sub: it.sub || g.subtitulo || '', color: it.color, grupo: g.id, itemId: 'ejemplo' };
  }
  // Ajusta un texto de una sola línea a su zona: el tamaño más grande que cabe a lo ancho y a lo alto
  function encajar(caja) {
    const t = caja.firstChild; if (!t) return;
    const w = caja.clientWidth, h = caja.clientHeight;
    let lo = 8, hi = Math.max(8, h * 0.9), best = lo;
    for (let i = 0; i < 11; i++) { const m = (lo + hi) / 2; t.style.fontSize = m + 'px'; if (t.scrollWidth <= w && t.offsetHeight <= h) { best = m; lo = m; } else hi = m; }
    t.style.fontSize = best + 'px';
  }
  function renderDiseno(o, item, nuevo, dis) {
    const fam = `'${String(dis.fuente || 'Montserrat').replace(/'/g, '')}', 'Montserrat', 'Source Sans 3', 'Segoe UI', sans-serif`;
    const textos = { nombre: item.texto, sub: item.sub || '', extra: o.extra || '' };
    const el = document.createElement('div');
    el._item = item;
    el.className = `rotulo completa ap-${o.aparicion}`;
    el.style.setProperty('--t', o.aparicion === 'instantaneo' || !nuevo ? '0s' : '.7s');
    const url = urlSegura(dis.url);
    let html = `<img class="cbg" src="${url}" alt="">`;
    for (const k of ['nombre', 'sub', 'extra']) {
      const zn = dis.zonas[k], t = textos[k];
      if (!zn || !t) continue;
      const just = { left: 'flex-start', center: 'center', right: 'flex-end' }[zn.alinear] || 'flex-start';
      html += `<div class="czona" style="left:${zn.x}px;top:${zn.y}px;width:${zn.w}px;height:${zn.h}px;justify-content:${just}">` +
        `<span style="font-family:${esc(fam)};color:${esc(zn.color || '#fff')};font-weight:${zn.negrita ? 800 : 500};text-transform:${zn.mayus ? 'uppercase' : 'none'}">${esc(t)}</span></div>`;
    }
    if (o.luces.on) html += `<div class="shine" style="opacity:${o.luces.intensidad / 100};--vel:${Math.max(1, 7 - o.luces.velocidad)}s;-webkit-mask-image:url('${url}');mask-image:url('${url}')"></div>`;
    el.innerHTML = html;
    document.getElementById('ovFull').appendChild(el);
    ovEl = el;
    const ajustarTodo = () => el.querySelectorAll('.czona').forEach(encajar);
    ajustarTodo();
    document.fonts?.load(`40px '${dis.fuente || 'Montserrat'}'`).then(ajustarTodo).catch(() => {});
    setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on'))), 0);
  }
  function renderCompleta(o, item, nuevo) {
    const dis = OVL.find((d) => d.id === o.diseno);
    if (dis && dis.zonas && dis.zonas.nombre) return renderDiseno(o, item, nuevo, dis);
    const c = o.completa || {}, n = c.nombre || {}, sb = c.sub || {};
    const fam = `'${String(c.fuente || 'Source Sans 3').replace(/'/g, '')}', 'Source Sans 3', 'Lato', 'Segoe UI', sans-serif`;
    const txt = (t, p) => `<div class="ctx" style="left:${+p.x || 0}px;top:${+p.y || 0}px;font-size:${+p.tam || 40}px;color:${esc(p.color || '#fff')};font-weight:${p.negrita ? 700 : 400};font-family:${esc(fam)}">${esc(t)}</div>`;
    const el = document.createElement('div');
    el._item = item;
    el.className = `rotulo completa ap-${o.aparicion}`;
    el.style.setProperty('--t', o.aparicion === 'instantaneo' || !nuevo ? '0s' : '.7s');
    const url = o.fondo.url ? urlSegura(o.fondo.url) : '';
    el.innerHTML = (url ? `<img class="cbg" src="${url}" alt="">` : '') + txt(item.texto, n) + txt(item.sub || '', sb) +
      (o.luces.on && url ? `<div class="shine" style="opacity:${o.luces.intensidad / 100};--vel:${Math.max(1, 7 - o.luces.velocidad)}s;-webkit-mask-image:url('${url}');mask-image:url('${url}')"></div>` : '');
    document.getElementById('ovFull').appendChild(el);
    ovEl = el;
    setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on'))), 0);
  }
  function ocultarOverlay(t = 0.5) {
    if (!ovEl) return;
    const old = ovEl; ovEl = null;
    if (!t) return old.remove();
    old.style.setProperty('--t', t + 's');
    old.classList.remove('on');
    setTimeout(() => old.remove(), t * 1000 + 100);
  }

  // ---------------- Banner ----------------
  // Busca el tamaño de letra más grande con el que el texto cabe completo (alto y ancho) dentro de "cont".
  // Se mide el contenido del texto (el.scrollHeight), no la caja: la caja tiene max-height y nunca "se desborda".
  function ajustar(el, cont, maxPx) {
    const cs = getComputedStyle(cont);
    const alto = cont.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let lo = 14, hi = Math.max(14, maxPx), best = lo;
    for (let i = 0; i < 12; i++) {
      const m = (lo + hi) / 2; el.style.fontSize = m + 'px';
      if (el.scrollHeight <= alto + 1 && el.scrollWidth <= el.clientWidth + 1) { best = m; lo = m; } else hi = m;
    }
    el.style.fontSize = best + 'px';
  }
  function renderBanner() {
    const b = st.modulo.banner;
    let vivo = st.vivo && st.vivo.texto ? st.vivo : null;
    if (!vivo && PREVIEW && b.ejemplo) vivo = EJEMPLO;
    const quiere = PREVIEW ? (previewBanner ?? SOLO !== 'overlay') : st.banner.visible;
    const visibleTodo = !EDITOR && SOLO !== 'overlay' && SOLO !== 'cuenta' && quiere && !!vivo && !st.negro;
    // Diseño lateral (ProyectoRP / PK): reemplaza la caja clásica del banner
    const dis = b.lateral ? LAT.find((l) => l.id === b.lateral) : null;
    renderLateral(dis, vivo, visibleTodo);
    const visible = visibleTodo && !dis;
    banner.classList.remove('hidden');
    banner.className = `${b.posicion} ap-${b.aparicion}` + (visible ? ' on' : '');
    banner.style.setProperty('--m', b.margen + 'px');
    banner.style.setProperty('--alto', b.alto + 'px');
    banner.style.setProperty('--t', b.aparicion === 'instantaneo' ? '0s' : b.transicion + 's');
    // Fondo
    const bbg = banner.querySelector('.bbg');
    bbg.classList.toggle('difuso', !!b.difuminado);
    const mk = SOLO === 'overlay' ? '' : b.fondo.tipo + '|' + b.fondo.url; // vista solo-rótulo: sin video de fondo
    if (mk !== bMediaKey) {
      bMediaKey = mk;
      const m = banner.querySelector('.bmedia');
      m.querySelectorAll('video').forEach((v) => { v.removeAttribute('src'); v.load(); });
      m.innerHTML = !mk || !b.fondo.url ? '' : b.fondo.tipo === 'video' ? `<video src="${urlSegura(b.fondo.url)}" loop muted playsinline preload="auto"></video>` : `<img src="${urlSegura(b.fondo.url)}" alt="">`;
    }
    banner.querySelectorAll('.bmedia > *').forEach((x) => (x.style.filter = b.desenfoque > 0 ? `blur(${b.desenfoque}px)` : 'none'));
    banner.querySelector('.bdim').style.opacity = b.fondo.url ? b.oscurecer / 100 : 0;
    banner.querySelector('.bcolor').style.background = hexA(b.colorFondo, b.opacidadFondo / 100);
    // Efecto y video de fondo solo trabajan mientras el banner se ve (ahorra procesador)
    clearTimeout(apagarT);
    if (visible) { fx.actualizar(b.efecto); medios(true); }
    else apagarT = setTimeout(() => { fx.actualizar({ ...b.efecto, on: false }); medios(false); }, (b.transicion || 0.6) * 1000 + 100);
    // Texto
    Object.assign(bInner.style, {
      fontFamily: `'${b.fuente}', 'Segoe UI', sans-serif`, fontWeight: b.negrita ? 700 : 400, fontStyle: b.cursiva ? 'italic' : 'normal',
      color: b.color, opacity: st.ocultarTexto ? 0 : b.opacidad / 100, letterSpacing: b.espaciado + 'px', lineHeight: b.interlineado / 100,
      textAlign: b.alineacion, transform: `translateY(${-b.subir}px)`,
    });
    if (vivo) {
      const tk = JSON.stringify([vivo.texto, vivo.ref, b.fuente, b.tam, b.negrita, b.cursiva, b.espaciado, b.interlineado, b.posicion, b.alto, b.colorCita]);
      if (tk !== bTextoKey) {
        const cambiaTexto = !bTextoKey.startsWith(JSON.stringify([vivo.texto]).slice(0, -1));
        bTextoKey = tk;
        const pintar = () => {
          bInner.innerHTML = fmt(vivo.texto) + (vivo.ref ? `<span class="cita" style="color:${b.colorCita}">${esc(vivo.ref)}</span>` : '');
          ajustar(bInner, banner.querySelector('.btxt'), b.tam);
          document.fonts?.load(`40px '${b.fuente}'`).then(() => ajustar(bInner, banner.querySelector('.btxt'), b.tam)).catch(() => {});
        };
        if (cambiaTexto && bVisible && visible) { bInner.style.transition = 'opacity .3s'; bInner.style.opacity = 0; setTimeout(() => { pintar(); bInner.style.opacity = st.ocultarTexto ? 0 : b.opacidad / 100; }, 300); }
        else pintar();
      } else {
        const c = bInner.querySelector('.cita'); if (c) c.style.color = b.colorCita;
      }
    }
    bVisible = visible;
  }

  // ---------------------------------------------------------------- Banner lateral
  let LAT = [], latRev = -1, latDib = null, latZona = null, latId = '', latOut = 500, latTxt = '';
  const latEl = document.getElementById('lateral');
  async function cargarLaterales() {
    try { LAT = await (await fetch('/api/laterales', { cache: 'no-store' })).json(); } catch (_) { LAT = []; }
    bTextoKey = ''; render();
  }
  function renderLateral(dis, vivo, visible) {
    const quiere = !!dis && visible;
    if (latDib && (!quiere || latId !== dis.id)) {
      const d = latDib, z = latZona;
      latDib = null; latZona = null; latTxt = '';
      z.style.transition = 'opacity .25s'; z.style.opacity = 0;
      d.salir(latOut).then(() => { d.limpiar(); z.remove(); });
    }
    if (!quiere) return;
    const zt = (dis.zona && dis.zona.texto) || {};
    if (!latDib) {
      latId = dis.id; latOut = +dis.outTime || 500;
      latDib = StingerMotor.dibujar(latEl, dis.elements || []);
      latDib.entrar(+dis.inTime || 600);
      const z = dis.zona || { x: 70, y: 10, w: 28, h: 80 };
      latZona = document.createElement('div');
      latZona.className = 'lzona';
      Object.assign(latZona.style, { left: z.x + '%', top: z.y + '%', width: z.w + '%', height: z.h + '%', opacity: 0, transition: 'opacity .5s' });
      latZona.innerHTML = '<div class="inner"></div>';
      latEl.appendChild(latZona);
      setTimeout(() => { if (latZona) latZona.style.opacity = 1; }, Math.min(900, (+dis.inTime || 600) * 0.6));
    }
    const inner = latZona.querySelector('.inner');
    const alin = { centro: 'center', izquierda: 'left', derecha: 'right', justificado: 'justify' }[(dis.zona || {}).alinear] || 'center';
    Object.assign(inner.style, {
      fontFamily: `'${String(zt.fuente || 'Montserrat').replace(/'/g, '')}', 'Montserrat', 'Segoe UI', sans-serif`, color: zt.color || '#fff',
      fontWeight: zt.negrita ? 700 : 500, fontStyle: zt.cursiva ? 'italic' : 'normal', textTransform: zt.mayusculas ? 'uppercase' : 'none',
      textShadow: zt.sombra ? '0 2px 10px rgba(0,0,0,.6)' : 'none', textAlign: alin, lineHeight: 1.22,
      opacity: st.ocultarTexto ? 0 : (zt.opacidad ?? 100) / 100,
    });
    const k = JSON.stringify([vivo.texto, vivo.ref, latId]);
    if (k === latTxt) return;
    const cambio = latTxt !== '';
    latTxt = k;
    const pintar = () => {
      inner.innerHTML = fmt(vivo.texto) + (vivo.ref ? `<span class="cita" style="color:${esc(zt.cita || '#f8b800')}">${esc(vivo.ref)}</span>` : '');
      const max = Math.max(24, +zt.tamano || 90);
      ajustar(inner, latZona, max);
      document.fonts?.load(`40px '${zt.fuente || 'Montserrat'}'`).then(() => latZona && ajustar(inner, latZona, max)).catch(() => {});
    };
    if (cambio) { inner.style.opacity = 0; setTimeout(() => { pintar(); inner.style.opacity = st.ocultarTexto ? 0 : (zt.opacidad ?? 100) / 100; }, 300); }
    else pintar();
  }

  // ---------------------------------------------------------------- Cuenta regresiva
  const cuentaEl = document.getElementById('cuenta');
  let desfase = 0, cuentaT = 0;
  function dosDig(n) { return String(n).padStart(2, '0'); }
  function renderCuenta() {
    clearTimeout(cuentaT);
    if (!st) return;
    const c = st.cuenta || {}, m = st.modulo.cuenta || {};
    const ejemplo = PREVIEW && (SOLO === 'cuenta' || EDITOR) && !c.activa;
    const mostrar = (c.activa || ejemplo) && (SOLO === '' || SOLO === 'cuenta' || EDITOR);
    const restante = ejemplo ? (m.minutos || 10) * 60000 : c.fin - (Date.now() + desfase);
    let txt, fin = false;
    if (restante > 0) {
      const s = Math.ceil(restante / 1000), h = Math.floor(s / 3600);
      txt = h ? `${h}:${dosDig(Math.floor(s / 60) % 60)}:${dosDig(s % 60)}` : `${dosDig(Math.floor(s / 60))}:${dosDig(s % 60)}`;
    } else { fin = true; txt = m.mensaje || ''; }
    const ver = mostrar && !(fin && (m.alTerminar === 'ocultar' || !txt));
    cuentaEl.classList.toggle('oculto', !ver);
    cuentaEl.classList.toggle('caja', !!m.fondo);
    Object.assign(cuentaEl.style, { left: (m.x ?? 960) + 'px', top: (m.y ?? 540) + 'px', fontSize: (m.tam || 190) + 'px',
      fontFamily: `'${String(m.fuente || 'Montserrat').replace(/'/g, '')}', 'Montserrat', 'Segoe UI', sans-serif` });
    const ct = cuentaEl.querySelector('.ct'), cn = cuentaEl.querySelector('.cn');
    ct.textContent = fin ? '' : (m.texto || ''); ct.style.color = m.colorTexto || '#f8b800'; ct.style.display = ct.textContent ? '' : 'none';
    cn.textContent = txt; cn.style.color = m.color || '#fff';
    cn.style.fontSize = fin ? '.42em' : '';
    cn.classList.toggle('fin', fin); cn.classList.toggle('ultimos', !fin && restante <= 10000);
    if (mostrar && !fin) cuentaT = setTimeout(renderCuenta, 250 - ((Date.now() + desfase) % 250));
  }

  function render() {
    if (!st) return;
    // Reloj del servidor (las vistas previas dentro del panel están en el mismo equipo: sin corrección)
    if (!EMBEBIDO && typeof st.ahora === 'number' && st._recibido) desfase = st.ahora - st._recibido;
    if (st.stingerRev !== latRev) { latRev = st.stingerRev; cargarLaterales(); }
    if (st.overlayRev !== ovlRev) { ovlRev = st.overlayRev; cargarOverlays(); }
    if (SOLO !== 'cuenta') { renderOverlay(); renderBanner(); }
    renderCuenta();
  }

  // La vista previa del panel envía el rótulo/banner que se quiere ver antes de salir al aire
  addEventListener('message', (e) => {
    // Mientras se arrastran los textos de un diseño en el panel: se redibuja al instante (sin esperar a guardar)
    if (e.origin === location.origin && e.data && e.data.tipo === 'ovlZonas') {
      const d = OVL.find((x) => x.id === e.data.id);
      if (d) { d.zonas = e.data.zonas; if (e.data.fuente) d.fuente = e.data.fuente; ovKey = ''; if (st) renderOverlay(); }
      return;
    }
    if (e.origin !== location.origin || !e.data || e.data.tipo !== 'preview') return;
    if ('item' in e.data) previewItem = e.data.item;
    if ('banner' in e.data) previewBanner = e.data.banner;
    ovKey = ''; render();
  });

  // Dentro del panel (vista previa) el estado llega del panel: así no se gastan conexiones
  // (los navegadores permiten solo 6 conexiones simultáneas por servidor).
  const EMBEBIDO = PREVIEW && window.parent !== window;
  function conectar() {
    if (EMBEBIDO) {
      addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.tipo === 'estado') { st = e.data.st; st._recibido = Date.now(); render(); } });
      window.parent.postMessage({ tipo: 'pedirEstado' }, location.origin);
      return;
    }
    const es = new EventSource('/api/eventos');
    es.addEventListener('estado', (e) => { st = JSON.parse(e.data); st._recibido = Date.now(); render(); });
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(conectar);
})();
</script>
</body>
</html>
