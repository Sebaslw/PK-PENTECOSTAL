<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<!-- PK-PENTECOSTAL · Hecho por Sebastian Lopez · IPUC Natania 6° Etapa · Zona Especial Misionera – Archipiélago de San Andrés, Providencia y Santa Catalina · «Por toda la tierra salió su voz, y hasta el extremo del mundo sus palabras.» Salmos 19:4 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK-PENTECOSTAL - Stinger OBS</title>
<link rel="icon" type="image/png" href="/icono-192.png">
<link rel="stylesheet" href="/fuentes.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.prev { background: repeating-conic-gradient(#1b2a44 0 25%, #14223a 0 50%) 0 0 / 40px 40px; }
  #root { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  .demo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 64px 'Montserrat', 'Segoe UI', sans-serif; color: rgba(255,255,255,.18); letter-spacing: .08em; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/obs/stinger-motor.js"></script>
<script>
(() => {
  // Uso:  /stinger              → fuente de navegador de OBS (escucha las órdenes del panel)
  //       /stinger?preview=1    → vista previa dentro del panel (recibe el diseño por postMessage, sin sonido salvo que se pida)
  const qs = new URLSearchParams(location.search);
  const PREVIEW = qs.get('preview') === '1';
  const root = document.getElementById('root');
  if (PREVIEW) { document.body.classList.add('prev'); root.innerHTML = '<div class="demo">ESCENA DE OBS</div>'; }
  const escalar = () => { root.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  addEventListener('resize', escalar); escalar();

  const resolver = StingerMotor.resolver;
  const motor = StingerMotor.crear(root, { resolver, silencio: PREVIEW });
  let lib = null, rev = -1, ultimo = 0, timerSalida = 0;

  async function cargar() {
    try { lib = await (await fetch('/api/stingers', { cache: 'no-store' })).json(); } catch (_) { return; }
    const s = elegido(); if (s) motor.precargar(s);
  }
  const elegido = (id) => lib && (lib.stingers.find((x) => x.id === (id || lib.activo)) || lib.stingers[0]);

  async function ejecutar(orden, s) {
    clearTimeout(timerSalida);
    if (!s) return;
    if (orden.accion === 'entrar') await motor.entrar(s);
    else if (orden.accion === 'salir') await motor.salir();
    else if (orden.accion === 'completo') {
      await motor.entrar(s);
      timerSalida = setTimeout(() => motor.salir(), Math.max(0, +orden.pausa || 0));
    } else if (orden.accion === 'cancelar') motor.limpiar();
  }

  if (PREVIEW && window.parent !== window) {
    // El panel manda el diseño (aunque no esté guardado) y la orden
    addEventListener('message', (e) => {
      if (e.origin !== location.origin || !e.data || e.data.tipo !== 'stinger') return;
      motor.silenciar(!e.data.sonido);
      if (e.data.precargar) return motor.precargar(e.data.stinger);
      ejecutar(e.data, e.data.stinger);
    });
    return;
  }

  const es = new EventSource('/api/eventos');
  es.addEventListener('estado', async (e) => {
    const st = JSON.parse(e.data);
    if (st.stingerRev !== rev || !lib) { rev = st.stingerRev; await cargar(); }
    const o = st.stinger;
    if (!o || !o.n || o.n === ultimo) return;
    const primera = ultimo === 0; ultimo = o.n;
    if (primera && Date.now() - o.t > 4000) return; // al abrir OBS no se repite una orden vieja
    ejecutar(o, elegido(o.id));
  });
})();
</script>
</body>
</html>
